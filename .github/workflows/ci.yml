name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: fixtures build
        run: |
          set -e
          for m in fixtures/*/go.mod fixtures/*/*/go.mod; do
            [ -f "$m" ] || continue
            d=${m%/go.mod}
            echo "== $d"
            (cd "$d" && go build ./...)
          done

      - name: extract fixtures + determinism
        run: OUT=out scripts/extract-fixtures.sh

      - name: proto drift
        run: scripts/check-proto.sh
