name: release

# Releases are cut by release-please:
#   1. Every push to main opens or updates a "chore(main): release X.Y.Z" PR
#      that bumps the version and CHANGELOG.md from the Conventional Commit
#      titles merged since the last release (see pr-title.yml).
#   2. Merging that PR tags vX.Y.Z and publishes the GitHub Release; the build
#      job below then attaches the artifacts to it.
# A PR that edits this file runs the build job as a dry run: the artifacts are
# kept on the workflow run and nothing is published.
on:
  push:
    branches: [main]
  pull_request:
    paths: [.github/workflows/release.yml]

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened with the default GITHUB_TOKEN does not trigger CI, so on a
      # main that requires status checks the release PR could never merge.
      # Setting the RELEASE_APP_CLIENT_ID variable and RELEASE_APP_PRIVATE_KEY
      # secret makes release-please act as that GitHub App instead.
      - uses: actions/create-github-app-token@v3
        id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app.outputs.token || github.token }}

  build:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # Checking out the tag lets go build stamp the module version from it
      # (`go version -m pc-fe` shows vX.Y.Z).
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: build
        run: |
          version=${TAG#v}
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${platform%/*} arch=${platform#*/}
            name=panoptife-go_${version:-dev}_${os}_${arch}
            mkdir -p "dist/$name"
            for cmd in pc-fe cgfdump cgfstat; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "dist/$name/" "./cmd/$cmd"
            done
            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: attach to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      - name: keep dry-run artifacts
        if: env.TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          retention-days: 3
